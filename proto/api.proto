syntax = "proto3";
package proto;

option go_package = "./proto";

import "common.proto";
import "apl.proto";
import "druid.proto";
import "hunter.proto";
import "mage.proto";
import "paladin.proto";
import "priest.proto";
import "rogue.proto";
import "shaman.proto";
import "warlock.proto";
import "warrior.proto";

// NextIndex: 49
message Player {
	// Label used for logging.
	string name = 1;

	Race race = 2;
	Class class = 4;

	EquipmentSpec equipment = 5;
	Consumes consumes = 6;
	UnitStats bonus_stats = 7;

	bool enable_item_swap = 40;
	ItemSwap item_swap = 45;

	IndividualBuffs buffs = 8;
	// The raid sim's per-player raid buffs (docs/raid_sim.md, Members get their own buff set): when set,
	// they replace Raid.buffs for this player wholesale, and the class AddRaidBuffs hooks are skipped
	// for it, so the resolver owns every buff.
	RaidBuffs raid_buffs = 53;

	// Talents in wowhead format, e.g. '01102123133-12312312-'
	string talents_string = 9;

	// Character level, 0 means max level (60). Base stats, ability ranks and the
	// per-level combat numbers (crit per agility, weapon skill) follow it.
	int32 level = 49;
	// Talent points on top of the ones the level grants (level minus 9). The Forever
	// beta caps at 20 but is expected to hand out 16 points there, so the "Level 20 + 5"
	// builds set 5. The sim itself never counts points, the UI picker and the rotopt
	// talent search cap with it.
	int32 bonus_talent_points = 50;
	// How far the main hand and off hand weapons' skill is below the most for the level (5 a
	// level), 0 for full skill. A weapon we haven't leveled yet misses, gets dodged, parried
	// and glanced more, glances for less and crits less.
	int32 main_hand_skill_gap = 51;
	int32 off_hand_skill_gap = 52;
	Profession profession1 = 10;
	Profession profession2 = 11;
	Cooldowns cooldowns = 12;

	APLRotation rotation = 13;

	// TODO: Move most of the remaining fields into a 'MiscellaneousPlayerOptions' message.
	// This will remove a lot of the boilerplate code in the UI for each new field.

	int32 reaction_time_ms = 14;
	int32 channel_clip_delay_ms = 15;
	bool in_front_of_target = 16;
	double distance_from_target = 17;

	// ISB Info
	double isb_sb_frequency = 41;
	double isb_crit = 42;
	int32 isb_warlocks = 43;
	int32 isb_spriests = 44;

	// Stormstrike Info
	double stormstrike_frequency = 47;
	double stormstrike_nature_attacker_frequency = 48;

	// Items/enchants/etc to include in the database.
	SimDatabase database = 18;
	HealingModel healing_model = 19;

	oneof spec {
		BalanceDruid balance_druid = 20;
		FeralDruid feral_druid = 21;
		FeralTankDruid feral_tank_druid = 22;
		RestorationDruid restoration_druid = 23;
		Hunter hunter = 24;
		Mage mage = 25;
		RetributionPaladin retribution_paladin = 26;
		ProtectionPaladin protection_paladin = 27;
		HolyPaladin holy_paladin = 28;
		HealingPriest healing_priest = 29;
		ShadowPriest shadow_priest = 30;
		Rogue rogue = 32;
		ElementalShaman elemental_shaman = 33;
		EnhancementShaman enhancement_shaman = 34;
		RestorationShaman restoration_shaman = 35;
		WardenShaman warden_shaman = 39;
		Warlock warlock = 36;
		Warrior warrior = 37;
		TankWarrior tank_warrior = 38;
	}
}

message Party {
	repeated Player players = 1;

	PartyBuffs buffs = 2;
}

message Raid {
	repeated Party parties = 1; 

	// The number of parties in the raid who participate in the sim, e.g.
	// 10-man vs 25-man raids. The remaining parties are unused but can hold
	// bench players.
	//
	// If this value is 0, all parties are included.
	int32 num_active_parties = 2;

	RaidBuffs buffs = 7;

	// Extra debuffs provided by buff bots in this raid.
	// This is also used for debuffs in the individual sims.
	Debuffs debuffs = 5;

	// Players who will be tanking mobs.
	repeated UnitReference tanks = 4;

	// Staggers Stormstrike casts across Enhance Shaman to maximize charge usage.
	bool stagger_stormstrikes = 3;

	// Extra fake players to add. Currently only used by healing sims.
	int32 target_dummies = 6;
}

message SimOptions {
	int32 iterations = 1;
	int64 random_seed = 2;
	bool debug = 3; // Enables debug logging.
	bool debug_first_iteration = 6;
	bool is_test = 5; // Only used internally.
	bool save_all_values = 7; // Only used internally.
	bool interactive = 8; // Enables interactive mode.
	bool use_labeled_rands = 9; // Use test level RNG.
	Ruleset ruleset = 10;

	// When set, the sim runs only the iterations with these seeds, with logs on, in the
	// order typical, lucky, unlucky. It doesn't run the usual iterations.
	//
	// A concurrent run uses it at the end. Each split sim picks its own typical, lucky and
	// unlucky iterations without logs, the combined result picks the overall ones, and one
	// more sim replays those three to get their logs.
	repeated int64 replay_seeds = 11;

	// Keeps each hit's fractional damage instead of rounding it to whole points like the game
	// does. The rounding changes no average, but it makes each hit vary more, so stat weight
	// runs set this to keep the gap between their two runs smooth.
	bool exact_damage = 12;
}

// Which game rules the engine simulates. Forever is the wire default, so anything
// that never mentions a ruleset (saved settings from an older build, a test config,
// a plain API request) runs Forever. Classic Era is the opt-in baseline that Forever
// layers its rule changes (unified hit and crit, periodic crits, etc) on top of.
enum Ruleset {
	RulesetForever = 0;
	RulesetClassic = 1;
}

// The aggregated results from all uses of a particular action.
message ActionMetrics {
	ActionID id = 1;

	// True if a melee action, false if a spell action.
	bool is_melee = 2;

	// Metrics for this action for each target.
	// Note that some spells are untargeted, these will always have a single
	// element in this array.
	repeated TargetedActionMetrics targets = 3;

	int32 spell_school = 4;

	// True if action is applied/cast as a result of another action
	bool is_passive = 5;
}

// Metrics for a specific action, when cast at a particular target.  Next = 37
message TargetedActionMetrics {
	reserved 19, 20;
	reserved "crit_block_damage", "crit_blocks";

	// Raid/Target Index of the unit these metrics are targeted at.
	int32 unit_index = 12;

	// # of times this action was used by the agent.
	int32 casts = 1;

	// # of times this action hit a target. For cleave spells this can be larger than casts.
	int32 hits = 2;

	// # of times this action resisted hit a target.
	int32 resisted_hits = 25;

	// # of times this action was a critical strike.
	int32 crits = 3;

	// # of times this action resisted crit a target.
	int32 resisted_crits = 26;

	// # of times this action ticked on a target.
	int32 ticks = 21;

	// # of times this action resisted ticked a target.
	int32 resisted_ticks = 27;

	// # of times this action was a critical tick on a target.
	int32 crit_ticks = 22;

	// # of times this action was a resisted tick on a target.
	int32 resisted_crit_ticks = 28;

	// # of times this action was a Miss or Resist.
	int32 misses = 4;

	// # of times this action was a Dodge.
	int32 dodges = 5;

	// # of times this action was a Parry.
	int32 parries = 6;

	// # of times this action was a Block.
	int32 blocks = 7;

	// # of times this action was a Blocked critical strike.
	int32 blocked_crits = 33;

	// # of times this action was a Crush.
	int32 crushes = 35;

	// # of times this action was a Glance.
	int32 glances = 8;

	// Total damage done to this target by this action.
	double damage = 9;

	// Total resisted damage done to this target by this action.
	double resisted_damage = 29;

	// Total critical damage done to this target by this action.
	double crit_damage = 15;

	// Total resisted critical damage done to this target by this action.
	double resisted_crit_damage = 30;

	// Total tick damage done to this target by this action.
	double tick_damage = 23;

	// Total resisted tick damage done to this target by this action.
	double resisted_tick_damage = 31;

	// Total critical tick damage done to this target by this action.
	double crit_tick_damage = 24;

	// Total resisted critical tick damage done to this target by this action.
	double resisted_crit_tick_damage = 32;

	// Total glancing damage done to this target by this action.
	double glance_damage = 17;

	// Total crushing damage done to this target by this action.
	double crush_damage = 36;

	// Total block damage done to this target by this action.
	double block_damage = 18;

	// Total blocked critical strike damage done to this target by this action.
	double blocked_crit_damage = 34;

	// Total threat done to this target by this action.
	double threat = 10;

	// Total healing done to this target by this action.
	double healing = 11;

	// Total critical healing done to this target by this action.
	double crit_healing = 16;

	// Total shielding done to this target by this action.
	double shielding = 13;

	// Total time spent casting this action, in milliseconds, either from hard casts, GCD, or channeling.
	double cast_time_ms = 14;
}

message AggregatorData {
	int32 n = 1;
	double sumSq = 2;
}

message AuraMetrics {
	ActionID id = 1;

	double uptime_seconds_avg = 2;
	double uptime_seconds_stdev = 3;

	double procs_avg = 4;

	AggregatorData aggregator_data = 5;
}

enum ResourceType {
	ResourceTypeNone = 0;
	ResourceTypeMana = 1;
	ResourceTypeEnergy = 2;
	ResourceTypeRage = 3;
	ResourceTypeComboPoints = 4;
	ResourceTypeFocus = 5;
	ResourceTypeHealth = 6;
}

message ResourceMetrics {
	ActionID id = 1;

	ResourceType type = 2;

	// # of times this action was used by the agent.
	int32 events = 3;

	// Total resource gain from this action. Will be negative for spend actions.
	double gain = 4;

	// Like gain, but doesn't include gains over resource cap.
	double actual_gain = 5;
}

message DistributionMetrics {
	double avg     = 1;
	double stdev   = 2;
	double max     = 3;
	int64 max_seed = 5;
	double min     = 6;
	int64 min_seed = 7;
	map<int32, int32> hist = 4;
	repeated double all_values = 8;
	AggregatorData aggregator_data = 9;
}

// All the results for a single Unit (player, target, or pet).
message UnitMetrics {
	string name = 9;
	int32 unit_index = 13;

	DistributionMetrics dps = 1;
	DistributionMetrics dpasp = 16;
	DistributionMetrics threat = 8;
	DistributionMetrics dtps = 11;
	DistributionMetrics tmi = 17;
	DistributionMetrics hps = 14;
	DistributionMetrics tto = 15; // Time To OOM, in seconds.
	DistributionMetrics mana_end = 18; // Mana left when the fight ends.

	// average seconds spent oom per iteration
	double seconds_oom_avg = 3; 

	// Chance (0-1) representing probability of death. Used for tank sims.
	double chance_of_death = 12;

	repeated ActionMetrics actions = 5;
	repeated AuraMetrics auras = 6;
	repeated ResourceMetrics resources = 10;

	repeated UnitMetrics pets = 7;
}

// Results for a whole raid.
message PartyMetrics {
	DistributionMetrics dps = 1;
	DistributionMetrics hps = 3;

	repeated UnitMetrics players = 2;
}

// Results for a whole raid.
message RaidMetrics {
	DistributionMetrics dps = 1;
	DistributionMetrics hps = 3;

	repeated PartyMetrics parties = 2;
}

message EncounterMetrics {
	repeated UnitMetrics targets = 1;

	// Set in leveling mode (Encounter.leveling): averages over the iterations.
	LevelingMetrics leveling = 2;
}

// What a grinding session (docs/leveling_sim.md) came to, averaged over the iterations.
message LevelingMetrics {
	// The score: mobs killed in the session, the one we're fighting at the end counted by
	// the share of its health we took.
	double mobs_killed = 1;
	double mobs_killed_stdev = 2;
	// XP from those kills (Classic's formula by level difference), and per hour.
	double xp = 3;
	double xp_per_hour = 4;
	double deaths = 5;
	// Average seconds of the session in each state.
	double seconds_in_combat = 6;
	double seconds_resting = 7;
	double seconds_searching = 8;
	double seconds_dead = 9;
	// Average number of mobs a pull came to, chain pulls included.
	double mobs_per_pull = 10;
	// Food, water and bandages used a session.
	double food = 11;
	double drinks = 12;
	double bandages = 13;
	// Each session's mobs killed, in iteration order, when SimOptions.save_all_values is on.
	// Stat weights compare them session by session, the way they use the DPS's all_values.
	repeated double all_kills = 14;
}

enum ErrorOutcomeType {
	ErrorOutcomeError = 0;
	ErrorOutcomeAborted = 1;
}

message ErrorOutcome {
	ErrorOutcomeType type = 1; // ErrorOutcomeError by default
	string message = 2;
}

// RPC RaidSim
message RaidSimRequest {
	Raid raid = 1;
	Encounter encounter = 2;
	SimOptions sim_options = 3;
}

// Result from running the raid sim.
message RaidSimResult {
	RaidMetrics raid_metrics = 1;
	EncounterMetrics encounter_metrics = 2;

	string logs = 3;

	// Needed for displaying the timeline properly when the duration +/- option
	// is used.
	double first_iteration_duration = 4;
	double avg_iteration_duration = 6;

	ErrorOutcome error = 5;

	int32 iterations_done = 7;

	// The iteration whose raid DPS is closest to the average, the one with the highest raid
	// DPS and the one with the lowest. The results show them event by event.
	//
	// With debug_first_iteration on, logs above holds the typical iteration's logs (and
	// first_iteration_duration its duration), and the lucky and unlucky ones carry their
	// own logs.
	IterationLog typical_iteration = 8;
	IterationLog lucky_iteration = 9;
	IterationLog unlucky_iteration = 10;

	// In a leveling run the picks above go by mobs killed instead of raid DPS, and this one
	// is the session with the most deaths (of those, the one closest to the average kills).
	// It's unset when no session had a death.
	IterationLog died_iteration = 11;
}

// One iteration of a run.
message IterationLog {
	// The seed the iteration ran with. Running the same request with this seed gives the
	// same iteration again.
	int64 seed = 1;
	double dps = 2;
	// In seconds.
	double duration = 3;
	string logs = 4;
	// A leveling session's mobs killed (the ones on us at the end by the share of their
	// health we took) and deaths. Zero outside the leveling mode.
	double kills = 5;
	int32 deaths = 6;
}

message RaidSimRequestSplitRequest {
	int32 split_count = 1;
	RaidSimRequest request = 2;
}

message RaidSimRequestSplitResult {
	// The actual split amount made
	int32 splits_done = 1;
	repeated RaidSimRequest requests = 2;
	string error_result = 3;
}

message RaidSimResultCombinationRequest {
	repeated RaidSimResult results = 1;
}

message AbortRequest {
	string request_id = 1; // The request that should be aborted.
}

message AbortResponse {
	string request_id = 1;
	bool was_triggered = 2; // Id was known and abort signal was triggered.
}

// RPC ComputeStats
message ComputeStatsRequest {
	Raid raid = 1;
	Encounter encounter = 2;

	// Stats are built differently under each ruleset, so the stat display needs to
	// know which one it is showing. SimOptions carries this for a full sim.
	Ruleset ruleset = 3;
}
message AuraStats {
	ActionID id = 1;
	int32 max_stacks = 2;
	bool has_icd = 3;
	bool has_exclusive_effect = 4;
	// Set when this is the highest rank of its ability that the unit has, below the ability's
	// top rank: the top rank's spell ID. A rotation names it to mean the highest rank at any
	// level.
	int32 highest_rank_id = 5;
}
message SpellStats {
	ActionID id = 1;

	bool is_castable = 2; // Whether this spell may be cast by the APL logic.
	bool is_channeled = 7; // Whether this spell is a channeled spell (Mind Flay, Drain Soul, etc).
	bool is_major_cooldown = 3; // Whether this spell is a major cooldown.
	bool has_dot = 4; // Whether this spell applies a DoT effect.
	bool has_shield = 6; // Whether this spell applies a shield effect.
	bool prepull_only = 5; // Whether this spell may only be cast during prepull.
	bool encounter_only = 8; // Whether this spell may only be cast during the encounter (not prepull).
	// Set when this is the highest rank of its ability that the unit knows, below the ability's
	// top rank: the top rank's spell ID. A rotation names it to cast the highest rank at any
	// level.
	int32 highest_rank_id = 9;
}
message APLActionStats {
	repeated string warnings = 1;
}
message APLStats {
	repeated APLActionStats prepull_actions = 1;
	repeated APLActionStats priority_list = 2;
}
message UnitMetadata {
	string name = 3;
	repeated SpellStats spells = 1;
	repeated AuraStats auras = 2;
}
message PetStats {
	UnitMetadata metadata = 1;
}
message PlayerStats {
	// Stats
	UnitStats base_stats = 6;
	UnitStats gear_stats = 1;
	UnitStats talents_stats = 7;
	UnitStats buffs_stats = 8;
	UnitStats consumes_stats = 9;
	UnitStats final_stats = 2;

	repeated string sets = 3;
	IndividualBuffs buffs = 4;

	UnitMetadata metadata = 10;
	APLStats rotation_stats = 12;

	repeated PetStats pets = 11;
}
message PartyStats {
	repeated PlayerStats players = 1;
}
message RaidStats {
	repeated PartyStats parties = 1;
}
message TargetStats {
	UnitMetadata metadata = 1;
}
message EncounterStats {
	repeated TargetStats targets = 1;
}
message ComputeStatsResult {
	RaidStats raid_stats = 1;
	EncounterStats encounter_stats = 3;
	string error_result = 2;
}

// RPC StatWeights
message StatWeightsRequest {
	Player player = 1;
	RaidBuffs raid_buffs = 2;
	PartyBuffs party_buffs = 3;
	Debuffs debuffs = 9;
	Encounter encounter = 4;
	SimOptions sim_options = 5;
	repeated UnitReference tanks = 8;

	repeated Stat stats_to_weigh = 6;
	repeated PseudoStat pseudo_stats_to_weigh = 10;
	Stat ep_reference_stat = 7;
}

message StatWeightsStatData {
	int32 unit_stat = 1;
	double mod_low = 2;
	double mod_high = 3;
}

message StatWeightsStatRequestData {
	StatWeightsStatData stat_data = 1;
	RaidSimRequest request_low = 2;
	RaidSimRequest request_high = 3;
}
message StatWeightRequestsData {
	RaidSimRequest base_request = 1;
	Stat ep_reference_stat = 2;
	repeated StatWeightsStatRequestData stat_sim_requests = 3;
}

message StatWeightsStatResultData {
	StatWeightsStatData stat_data = 1;
	RaidSimResult result_low = 2;
	RaidSimResult result_high = 3;
}
message StatWeightsCalcRequest {
	RaidSimResult base_result = 1;
	Stat ep_reference_stat = 2;
	repeated StatWeightsStatResultData stat_sim_results = 3;
}

message StatWeightsResult {
	StatWeightValues dps = 1;
	StatWeightValues hps = 4;
	StatWeightValues tps = 2;
	StatWeightValues dtps = 3;
	StatWeightValues tmi = 5;
	StatWeightValues p_death = 6;
	ErrorOutcome error = 7;
}
message StatWeightValues {
	UnitStats weights = 1;
	UnitStats weights_stdev = 2;
	UnitStats ep_values = 3;
	UnitStats ep_values_stdev = 4;
}

message AsyncAPIResult {
  string progress_id = 1;
} 

// ProgressMetrics are used by all async APIs
message ProgressMetrics {
	int32 completed_iterations = 1;
	int32 total_iterations = 2;
	int32 completed_sims = 3;
	int32 total_sims = 4;
	bool presim_running = 8;

	// Partial Results 
	double dps = 5;
	double hps = 9;

	// Final Results
	RaidSimResult final_raid_result = 6; // only set when completed
	StatWeightsResult final_weight_result = 7;
	BulkSimResult final_bulk_result = 10;
	CompSearchResult final_comp_search_result = 11;
	// The comp search's progress: the best comp so far.
	CompResult comp_search_best = 12;
	string comp_search_phase = 13;
}

// RPC: BulkSim
message BulkSimRequest {
    RaidSimRequest base_settings = 1;
    BulkSettings bulk_settings = 2;
}

message TalentLoadout {
	string talents_string = 1;
	string name = 2;
}

message BulkSettings {
	repeated ItemSpec items = 1;
	bool combinations = 2;
	bool fast_mode = 3; // Used to run with less iterations to start and slowly increase to weed out items faster.
	// Use current enchant on the slot if not specified by the ItemSpec.
	// Only works when replacement item is valid target for enchant.
	bool auto_enchant = 4;

	// Copied from WOTLK but not removed so reserved instead
	reserved 5;
    reserved "auto_gem";
	reserved 6;
    reserved "default_red_gem";
	reserved 7;
    reserved "default_blue_gem";
	reserved 8;
    reserved "default_yellow_gem";
	reserved 9;
    reserved "default_meta_gem";
	reserved 10;
    reserved "ensure_meta_req_met";

	// Number of iterations per combo.
	// If set to 0 the sim core decides the optimal iterations.
	int32 iterations_per_combo = 11;
	// Should sim talents as well
	bool sim_talents = 12;
	repeated TalentLoadout talents_to_sim = 13;
}

message BulkSimResult {
    repeated BulkComboResult results = 1;
	BulkComboResult equipped_gear_result = 2;
    ErrorOutcome error = 3; // only set if sim failed.
}

message BulkComboResult {
    repeated ItemSpecWithSlot items_added = 1;
    UnitMetrics unit_metrics = 2;
	TalentLoadout talent_loadout = 3;
}

message ItemSpecWithSlot {
    ItemSpec item = 1;
    ItemSlot slot = 2;
}

// The raid sim (docs/raid_sim.md): a comp of DPS members and tank and healer placeholders, the comp
// search's request and its result.

// A job a member does for the raid (docs/raid_sim.md, Assignments).
enum Duty {
	DutyNone = 0;
	DutyBattleShout = 1;
	DutySunderUpkeep = 2;
	DutyFaerieFire = 3;
	DutyCurseOfTheElements = 4;
	DutyCurseOfRecklessness = 5;
	DutyJudgementOfTheCrusader = 6;
	DutyJudgementOfWisdom = 7;
}

// The tank and healer presets (docs/raid_sim.md, Tank and healer presets).
enum RaidPreset {
	RaidPresetUnknown = 0;
	RaidPresetProtectionWarrior = 1;
	RaidPresetFeralTank = 2;
	RaidPresetProtectionPaladin = 3;
	RaidPresetWardenShaman = 4;
	RaidPresetHolyPaladin = 5;
	RaidPresetRestorationShaman = 6;
	RaidPresetDisciplinePriest = 7;
	RaidPresetHolyPriest = 8;
	RaidPresetRestorationDruid = 9;
}

enum RaidRole {
	RaidRoleDps = 0;
	RaidRoleTank = 1;
	RaidRoleHealer = 2;
}

enum Blessing {
	BlessingNone = 0;
	BlessingKings = 1;
	BlessingMight = 2;
	BlessingWisdom = 3;
}

enum PaladinJudgement {
	PaladinJudgementNone = 0;
	PaladinJudgementCrusader = 1;
	PaladinJudgementWisdom = 2;
}

// The totems that change DPS, by element.
enum RaidTotem {
	RaidTotemNone = 0;
	RaidTotemStrengthOfEarth = 1; // earth
	RaidTotemGraceOfAir = 2;      // air
	RaidTotemWindfury = 3;        // air
	RaidTotemManaSpring = 4;      // water
	RaidTotemFlametongue = 5;     // fire
}

// The party effects one party has (docs/raid_sim.md, Groups).
enum RaidPackage {
	RaidPackageNone = 0;
	RaidPackageManaSpring = 1;         // an Enhancement, Elemental or Warden shaman
	RaidPackageManaSpringTide = 2;     // a "+ Mana Tide" shaman: Mana Spring and Mana Tide
	RaidPackageRestoration = 3;        // a Restoration shaman: Mana Spring x1.25 and Mana Tide
}

// The rules the client can't settle, as the search ran them (docs/raid_sim.md, Sensitivity).
message RaidAssumptions {
	// The Camp Chair loses only its spell crit to Moonkin Aura, not the whole aura.
	bool camp_chair_spell_crit_only = 1;
	// Camp buffs stack with the group versions of their class buffs.
	bool camp_buffs_stack_with_group_buffs = 2;
	// Only the 5 camp features worth most to the comp (one Journeyman camp).
	bool journeyman_camp = 3;
}

// One member of a comp: a DPS build with its duty players, or a tank or healer placeholder.
message CompSlot {
	int32 id = 1; // stable: assignments name slots by it
	int32 party = 2;
	int32 index = 3;
	RaidRole role = 4;
	oneof member {
		CompMemberBuild build = 5;
		RaidPreset placeholder = 6;
	}
	// Display, and the comparison with the DPS Report.
	string report_id = 7;
	string name = 8;
	// The Feral tank's Innervate (off by default, since it means leaving Bear Form).
	bool preset_innervate = 9;
}

message CompMemberBuild {
	Player base = 1;
	repeated CompDutyPlayer duties = 2;
}

message CompDutyPlayer {
	Duty duty = 1;
	Player player = 2;
}

// A job and who holds it.
message Assignment {
	int32 holder = 1; // slot id
	bool set_by_hand = 2;
	oneof job {
		Duty duty = 3;
		BlessingAssignment blessing = 4;
		PaladinJudgement judgement = 5;
		TotemAssignment totem = 6;
		CooldownTarget cooldown = 7;
	}
}

message BlessingAssignment {
	Class class = 1;
	Blessing blessing = 2;
}

message TotemAssignment {
	RaidTotem totem = 1;
}

message CooldownTarget {
	bool power_infusion = 1; // else Innervate
	int32 target = 2;        // slot id
}

// A raid to sim (milestone M1b's RunComp).
message RaidComp {
	int32 size = 1;
	repeated CompSlot slots = 2;
	Encounter encounter = 3;
	repeated Assignment assignments = 4;
	Faction faction = 5;
	bool camp_buffs = 6;
	RaidAssumptions assumptions = 7;
	SimOptions sim_options = 8;
}

// The fight a search runs.
message CompEncounter {
	string name = 1;       // "Generic", "Onyxia"
	double duration = 2;   // seconds; default 180
	double duration_variation = 3; // default 20
	// A health fight ends when the boss dies; duration is then a first guess.
	bool use_health = 4;
	double boss_health = 5;
	MobType mob_type = 6;
	bool natural_flask_zone = 7;
}

message CompSearchRequest {
	int32 size = 1; // 10, 20 or 40
	int32 tanks = 2;
	int32 healers = 3;
	// Fixed presets for the first tank and healer slots; the rest are searched.
	repeated RaidPreset fixed_tanks = 4;
	repeated RaidPreset fixed_healers = 5;
	// Fixed DPS members (report build ids), with the rest filled by the search.
	repeated string fixed_dps = 6;
	CompEncounter encounter = 7;
	repeated Faction factions = 8; // default both
	repeated bool camp_buffs = 9;  // default on and off
	int32 iterations = 10;            // the screening sims, default 1000
	int32 contender_iterations = 11;  // the contenders' re-sims, default 10000
	int64 seed = 12;
	RaidAssumptions assumptions = 13;
	// Raid sims to confirm the top sets (milestone M1b). Off in M1.
	bool confirm = 14;
	int32 confirm_iterations = 15;      // default 5000
	int32 confirm_top_iterations = 16;  // default 20000
	// Leave the sensitivity scenarios out.
	bool skip_sensitivity = 17;
	// Up to this many tank and healer combos are re-filled and ranked (0: all).
	int32 max_combos = 18;
}

// One member of a result comp.
message CompResultMember {
	int32 party = 1;
	RaidRole role = 2;
	string build_id = 3;        // a report build, or the preset's name for a placeholder
	RaidPreset preset = 4;
	repeated Duty duties = 5;
	double dps = 6;
	double se = 7;
	double duty_cost = 8;      // its base DPS minus its DPS on duty, under the same set
	double tps = 9;
	repeated Blessing blessings = 10;
	bool power_infusion = 11;
	bool innervate = 12;
	RaidPackage package = 13;
	PaladinJudgement judgement = 14;
	repeated RaidTotem totems = 15;
	string race = 16;
	double report_dps = 17;    // its report build's published DPS
}

message CompResult {
	double dps = 1;            // raid DPS: the members' sum
	double se = 2;
	double gap = 3;            // behind the best
	double gap_se = 4;
	repeated CompResultMember members = 5;
	string buff_set = 6;       // the buff set, in words
	bool confirmed = 7;        // raid-simmed (M1b)
	double raid_sim_dps = 8;
	double raid_sim_se = 9;
	repeated RaidPreset combo = 10; // its tanks and healers
	double model_dps = 11;
}

message CompRoleValue {
	string role = 1;
	double gain = 2;            // what the role adds at the winning set, re-filled
	double provider_cost = 3;
	double net = 4;
	string provider = 5;
	bool in_set = 6;            // false: the value of adding it
}

message CompFillerRank {
	string build_id = 1;
	double dps = 2;
	double se = 3;
	double assumption_low = 4;
	double assumption_high = 5;
	bool interchangeable = 6;   // within 2 standard errors of the best
}

message CompMemberValue {
	int32 member = 1;            // index into the best comp's members
	double contribution = 2;     // raid DPS minus raid DPS without the member
	double own_dps = 3;
	double replacement_margin = 4;
	string best_replacement = 5;
	double report_difference = 6;
	repeated string report_difference_parts = 7;
	string build_id = 8;
	int32 count = 9;             // identical members sharing this value
}

message CompValueOfAdding {
	string build_id = 1;
	double value = 2;            // the best raid DPS with it swapped in, minus raid DPS
}

message CompComboRank {
	repeated RaidPreset presets = 1;
	double dps = 2;
	double gap = 3;
	string signature = 4;
}

message CompPresetValue {
	RaidPreset preset = 1;
	double at_best = 2;           // the best combo minus the best with that slot's preset changed
	double best_with_minus_without = 3;
}

message CompBuffRecord {
	string effect = 1;
	string provider = 2;
	string scope = 3;
	int32 receivers = 4;
	bool given = 5;
}

message CompSensitivity {
	string scenario = 1;
	bool winner_holds = 2;
	repeated CompResult winners = 3;
	string note = 4;
}

message CompModelCheck {
	int32 sets_scored = 1;
	int32 sets_simmed = 2;
	double max_miss = 3;      // the largest |exact - model| of a simmed set
	double mean_miss = 4;
}

message CompScenarioResult {
	Faction faction = 1;
	bool camp_buffs = 2;
	double fight_seconds = 3;
	repeated CompResult comps = 4;      // the best first, then the runners-up
	int32 tie_set = 5;                  // the first this many comps are a tie
	repeated CompComboRank combos = 6;
	repeated CompPresetValue preset_values = 7;
	repeated CompRoleValue roles = 8;
	repeated CompFillerRank fillers = 9;
	repeated CompMemberValue member_values = 10;
	repeated CompValueOfAdding adding = 11;
	repeated CompBuffRecord buffs = 12;
	repeated string misses = 13;
	CompModelCheck model_check = 14;
	repeated CompSensitivity sensitivity = 15;
	repeated string notes = 16;
	repeated string timings = 17;       // sims and seconds by phase
}

message CompSearchResult {
	CompSearchRequest request = 1;
	repeated CompScenarioResult scenarios = 2;
	repeated string assumptions = 3;
	repeated string left_out = 4;          // role options this run can't express
	repeated string not_modelled = 5;
	string version = 6;
	int64 sims_run = 7;
	int64 cache_hits = 8;
	double seconds = 9;
	ErrorOutcome error = 10;
}

// The resolver (docs/raid_sim.md, M1b): a comp into the raid's request, and what it gives whom.
message RaidCompResolution {
	RaidSimRequest request = 1;
	// The slot each player of the request is (parties and players in order, placeholders left out).
	repeated int32 slot_of_player = 2;
	repeated CompBuffRecord buffs = 3;
	repeated string misses = 4;
	repeated Assignment assignments = 5; // every assignment, the automatic ones filled in
	ErrorOutcome error = 6;
}

// The page's run of a comp: the raid sim's result with the resolution it ran.
message RaidCompRunResult {
	RaidCompResolution resolution = 1;
	RaidSimResult result = 2;
}
