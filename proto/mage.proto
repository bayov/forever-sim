syntax = "proto3";
package proto;

option go_package = "./proto";

message MageTalents {
	// Arcane
	int32 wand_specialization = 1;
	int32 arcane_focus = 2;
	int32 improved_channeling = 3;
	int32 missile_barrage = 4;
	int32 arcane_subtlety = 5;
	int32 magic_absorption = 6;
	int32 arcane_concentration = 7;
	int32 arcane_resilience = 8;
	int32 arcane_geometry = 9;
	int32 arcane_impact = 10;
	bool arcane_blast = 11;
	int32 arcane_shielding = 12;
	int32 improved_counterspell = 13;
	int32 arcane_meditation = 14;
	bool arcane_wrath = 15;
	bool presence_of_mind = 16;
	int32 arcane_mind = 17;
	int32 arcane_instability = 18;
	bool arcane_power = 19;

	// Fire
	int32 improved_fire_blast = 20;
	int32 incineration = 21;
	int32 improved_fireball = 22;
	int32 ignite = 23;
	int32 flame_throwing = 24;
	int32 impact = 25;
	int32 burning_soul = 26;
	int32 improved_flamestrike = 27;
	bool pyroblast = 28;
	int32 improved_scorch = 29;
	int32 improved_fire_ward = 30;
	bool heating_up = 31;
	int32 master_of_elements = 32;
	int32 critical_mass = 33;
	bool blast_wave = 34;
	int32 fire_power = 35;
	bool combustion = 36;

	// Frost
	int32 frost_warding = 37;
	int32 improved_frostbolt = 38;
	int32 elemental_precision = 39;
	int32 ice_shards = 40;
	int32 frostbite = 41;
	int32 improved_frost_nova = 42;
	int32 permafrost = 43;
	int32 frost_channeling = 44;
	int32 improved_blizzard = 45;
	bool ice_lance = 46;
	int32 arctic_reach = 47;
	bool ice_block = 48;
	int32 shatter = 49;
	int32 improved_cone_of_cold = 50;
	bool cold_snap = 51;
	int32 fingers_of_frost = 52;
	int32 winters_chill = 53;
	bool ice_barrier = 54;
}

message Mage {
	message Rotation {
	}

	message Options {
		enum ArmorType {
			NoArmor = 0;
			IceArmor = 1;
			MageArmor = 2;
			MoltenArmor = 3;
		}
		ArmorType armor = 1;

		// Forever's mage-only staff imbue scrolls (Comprehension skill), in the class imbue slot,
		// so they stack with a weapon oil. Staff only, 1 hour.
		enum StaffImbue {
			NoStaffImbue = 0;
			// Scroll of Imbue Greater Flame (277500): +20 Fire damage.
			ImbueGreaterFlame = 1;
			// Scroll of Imbue Greater Frost (277501): +20 Frost damage.
			ImbueGreaterFrost = 2;
			// Scroll of Imbue Precision (277502): +1% spell crit.
			ImbuePrecision = 3;
		}
		StaffImbue staff_imbue = 2;
	}
	Options options = 3;
}
