syntax = "proto3";
package proto;

option go_package = "./proto";

import "common.proto";

message RogueTalents {
	// Assassination
	int32 improved_gouge = 1;
	int32 remorseless_attacks = 2;
	int32 malice = 3;
	int32 ruthlessness = 4;
	int32 improved_expose_armor = 5;
	int32 improved_slice_and_dice = 6;
	int32 vigor = 7;
	bool blood_splatter = 8;
	int32 lethality = 9;
	int32 vile_poisons = 10;
	bool cold_blood = 11;
	int32 improved_poisons = 12;
	int32 relentless_strikes = 13;
	bool venom = 14;
	int32 improved_kidney_shot = 15;
	int32 seal_fate = 16;
	bool mutilate = 17;

	// Combat
	int32 coup_de_grace = 18;
	int32 efficient_strikes = 19;
	int32 lightning_reflexes = 20;
	int32 puncturing_wounds = 21;
	int32 deflection = 22;
	int32 precision = 23;
	int32 improved_sprint = 24;
	int32 endurance = 25;
	bool riposte = 26;
	int32 composure = 27;
	int32 improved_kick = 28;
	bool flawless_execution = 29;
	int32 aggression = 30;
	int32 weapon_expertise = 31;
	int32 dual_wield_specialization = 32;
	bool blade_flurry = 33;
	int32 hack_and_slash = 34;
	int32 flash_of_steel = 35;
	bool adrenaline_rush = 36;

	// Subtlety
	int32 setup = 37;
	int32 master_of_deception = 38;
	int32 opportunity = 39;
	int32 camouflage = 40;
	int32 dirty_deeds = 41;
	int32 dirty_tricks = 42;
	int32 improved_ambush = 43;
	int32 initiative = 44;
	bool premeditation = 45;
	int32 serrated_blades = 46;
	int32 elusiveness = 47;
	bool ghostly_strike = 48;
	int32 quick_getaway = 49;
	int32 heightened_senses = 50;
	bool preparation = 51;
	bool hemorrhage = 52;
	int32 boot_knife = 53;
	bool death_mark = 54;
}

message RogueOptions {
	// Forever's poisons are class imbues (client 70338: SpellEffect 360, like the shaman's weapon
	// imbues) where Era's were temporary enchants (54), so a poison sits beside a sharpening stone
	// or oil. They get their own fields, which leaves Consumes' main and off hand imbues for the
	// stone. Left unset, the poisons are read from Consumes as before.
	WeaponImbue main_hand_poison = 1;
	WeaponImbue off_hand_poison = 2;
}

message Rogue {
	message Rotation {
	}

	RogueOptions options = 2;
}

message TankRogue {
	message Rotation {
	}

	RogueOptions options = 2;
}
