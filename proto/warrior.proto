syntax = "proto3";
package proto;

option go_package = "./proto";

message WarriorTalents {
	// Arms
	int32 improved_heroic_strike = 1;
	int32 deflection = 2;
	int32 improved_rend = 3;
	int32 improved_charge = 4;
	int32 improved_tactical_mastery = 5;
	int32 improved_overpower = 6;
	bool anger_management = 7;
	int32 deep_wounds = 8;
	bool spearing_strike = 9;
	int32 two_handed_weapon_specialization = 10;
	int32 impale = 11;
	int32 bloodthrill = 12;
	bool sweeping_strikes = 13;
	int32 weaponmaster = 14;
	int32 improved_slam = 15;
	int32 improved_hamstring = 16;
	bool mortal_strike = 17;

	// Fury
	int32 booming_voice = 18;
	int32 cruelty = 19;
	int32 lingering_rage = 20;
	int32 unbridled_wrath = 21;
	int32 furious_precision = 22;
	bool piercing_howl = 23;
	int32 blood_craze = 24;
	int32 enrage = 25;
	int32 dual_wield_specialization = 26;
	bool reckless_swings = 27;
	int32 improved_execute = 28;
	int32 improved_berserker_rage = 29;
	bool death_wish = 30;
	int32 gore_drinker = 31;
	int32 improved_intercept = 32;
	int32 improved_whirlwind = 33;
	int32 flurry = 34;
	bool bloodthirst = 35;

	// Protection
	int32 improved_bloodrage = 36;
	int32 shield_specialization = 37;
	int32 iron_will = 38;
	int32 anticipation = 39;
	int32 improved_revenge = 40;
	int32 improved_thunder_clap = 41;
	bool last_stand = 42;
	int32 master_of_defense = 43;
	int32 improved_disarm = 44;
	int32 defiance = 45;
	int32 improved_sunder_armor = 46;
	bool vanguard = 47;
	int32 improved_shield_bash = 48;
	int32 improved_shield_wall = 49;
	bool concussion_blow = 50;
	int32 focused_rage = 51;
	int32 bastion = 52;
	bool shield_slam = 53;

}

enum WarriorShout {
	WarriorShoutNone = 0;
	WarriorShoutBattle = 1;
	WarriorShoutCommanding = 2;
}

enum WarriorStance {
	WarriorStanceNone = 0;
	WarriorStanceBattle = 1;
	WarriorStanceDefensive = 2;
	WarriorStanceBerserker = 3;
	WarriorStanceGladiator = 4;
}

message Warrior {
	message Rotation {
	}

	message Options {
		reserved 2;
		reserved "use_recklessness";

		double starting_rage = 1;
		bool stance_snapshot = 6;
		int32 queue_delay = 8;

		WarriorShout shout = 3;
		WarriorStance stance = 7;

		// Moved to Encounter.raid_damage_hits_per_minute and raid_damage_per_hit, for every class.
		double raid_damage_hits_per_minute = 9 [deprecated = true];
		double raid_damage_per_hit = 10 [deprecated = true];
	}
	Options options = 3;
}

message TankWarrior {
	message Rotation {
	}

	message Options {
		double starting_rage = 1;
		bool stance_snapshot = 6;
		int32 queue_delay = 8;

		WarriorShout shout = 3;
		WarriorStance stance = 7;
	}
	Options options = 3;
}
