// Zones not yet available to players
enum ExcludedZones {
	ZoneUnknown = 0;
}

// Next tag: 23
message DatabaseFilters {
	repeated ArmorType armor_types = 1;
	repeated WeaponType weapon_types = 2;
	repeated RangedWeaponType ranged_weapon_types = 16;
	repeated SourceFilterOption sources = 17;
	repeated RaidFilterOption raids = 18;
	UIItem.FactionRestriction faction_restriction = 19;
	int32 min_ilvl = 21;
	int32 max_ilvl = 22;

	double min_mh_weapon_speed = 4;
	double max_mh_weapon_speed = 5;
	double min_oh_weapon_speed = 9;
	double max_oh_weapon_speed = 10;
	double min_ranged_weapon_speed = 14;
	double max_ranged_weapon_speed = 15;

	bool one_handed_weapons = 6;
	bool two_handed_weapons = 7;

	// Item IDs for favorited items.
	repeated int32 favorite_items = 11;
	// Uniquely-identifying strings for favorited enchants.
	repeated string favorite_enchants = 13;
	repeated int32 favorite_random_suffixes = 20;
}

message SimSettings {
	int32 iterations = 1;
	int32 phase = 2;
	int64 fixed_rng_seed = 3;
	bool show_damage_metrics = 8;
	bool show_threat_metrics = 4;
	bool show_healing_metrics = 7;
	bool show_experimental = 5;
	bool show_ep_values = 11;
	string language = 9;
	Faction faction = 6;
	DatabaseFilters filters = 10;
	Ruleset ruleset = 12;
}

// Contains all information that is imported/exported from an individual sim.
message IndividualSimSettings {
	SimSettings settings = 5;
	RaidBuffs raid_buffs = 1;
	Debuffs debuffs = 8;
	repeated UnitReference tanks = 7;
	PartyBuffs party_buffs = 2;
	Player player = 3;
	Encounter encounter = 4;
	int32 target_dummies = 9;
	UnitStats ep_weights_stats = 10;
	repeated double ep_ratios = 11;
	Stat dps_ref_stat = 12;
	Stat heal_ref_stat = 13;
	Stat tank_ref_stat = 14;
	LevelingGearPlanSettings leveling_gear_plan = 15;
	LevelingPlanSettings leveling_plan = 16;
}

// The leveling plan's talents and rotations (ui/core/leveling_plan.ts). Its gear is the
// LevelingGearPlanSettings.
message LevelingPlanSettings {
	// We sim each level from from_level up to, but not including, to_level.
	int32 from_level = 1;
	int32 to_level = 2;
	// The extra talent points Forever gives from level 25.
	int32 bonus_talent_points = 3;
	// The first build starts at from_level. Each later one is a respec at its level.
	repeated LevelingTalentBuild builds = 4;
	// Each level range plays a rotation of rotation_library from its level until the next
	// range's.
	repeated LevelingRotation rotations = 5;
	// Whether we level with the Settings tab's buffs, debuffs and consumables. Without it we
	// level solo, because the Settings tab usually has a raid's, like Goblin Sapper Charges
	// that hurt a level 10 more than the mobs do.
	bool use_settings_buffs = 6;
	// The plan's own rotations, by name. The level ranges in rotations pick from them.
	repeated LevelingRotationPreset rotation_library = 7;
	// Whether the library's rotations name an ability's top rank where they mean the highest
	// rank we know, as they have since 2026-10-17. Plans saved before named the highest rank
	// at their level, and the Leveling Plan tab moves them over once.
	bool rotations_name_top_ranks = 8;
	// Talents we take whatever the sim says, like Improved Ghost Wolf for walking to quests
	// and grind spots, which a grinding session doesn't sim. The talent search keeps them.
	repeated LevelingTalentRequirement required_talents = 9;
	// Which spell ranks we train when, under a gold budget (docs/leveling_plan.md, Training).
	LevelingTrainingSettings training = 10;
}

// Training: the gold we have by level, riding, and when we buy each rank.
message LevelingTrainingSettings {
	// The gold earned by level 40, net of food, water and repairs, in gold. The gold earned by
	// any level grows with the level to the power 3.5 from it. 0 means no budget, and we train
	// every rank at its level.
	double gold_at_40 = 1;
	// The level we buy riding at, and what riding costs then, in gold. Level 0 is no riding.
	int32 riding_level = 2;
	double riding_gold = 3;
	// When we train each rank, for the ranks we don't train at their own level. A rank with no
	// entry is trained at its level.
	repeated LevelingTrainingBuy buys = 4;
	// What each rank is worth, from the training search. Only shown, the sim doesn't read it.
	repeated LevelingRankWorth worth = 5;
}

message LevelingTrainingBuy {
	int32 spell_id = 1;
	// The level we train the rank at, past 60 for never.
	int32 level = 2;
}

message LevelingRankWorth {
	int32 spell_id = 1;
	// The rank's level, and the trainer's price in copper before any discount.
	int32 level = 2;
	int32 price = 3;
	// The minutes the rank saves over the levels it's our highest rank, when we train it at its
	// level.
	double minutes = 4;
	// Its rank number, like 3 for Lightning Shield (Rank 3).
	int32 rank = 5;
}

// A talent we must have at least points in from level on.
message LevelingTalentRequirement {
	int32 tree = 1;
	int32 talent = 2;
	int32 points = 3;
	int32 level = 4;
}

// A talent build and the order we put its points in. At each level we have the first picks,
// as many as the level gives points.
message LevelingTalentBuild {
	int32 level = 1;
	repeated LevelingTalentPick picks = 2;
}

// One talent point: the tree (0 to 2) and the talent's place in that tree's talent string.
message LevelingTalentPick {
	int32 tree = 1;
	int32 talent = 2;
}

// A level range of the plan: from its level until the next range's, we play the rotation of
// rotation_library with its name.
message LevelingRotation {
	int32 level = 1;
	string name = 2;
	// Only in plans saved before rotation_library, which held each range's rotation here. We
	// move it into the library when we load such a plan.
	APLRotation rotation = 3;
	// The class's own weapon imbue for these levels, like Rockbiter before Windfury Weapon.
	// Unknown keeps the one in the class options.
	WeaponImbue imbue = 4;
}

// One of the leveling plan's own rotations. A name the spec's rotation presets also have means
// it started as a copy of that preset.
message LevelingRotationPreset {
	string name = 1;
	APLRotation rotation = 2;
}

// The leveling gear plan's own choices (ui/core/leveling_gear.ts): the seed of its random
// finds, and the items we put in by hand.
message LevelingGearPlanSettings {
	int32 seed = 1;
	repeated LevelingGearPin pins = 2;
	// Make up the quest rewards and dungeon runs even when the spec has a leveling route.
	bool ignore_route = 3;
}

// The quest rewards and dungeon runs of a leveling route, like our RestedXP route for an Orc
// Shaman (tools/leveling_route). The leveling gear plan takes them in place of the quest rewards
// and dungeon runs it makes up.
message LevelingRoute {
	string name = 1;
	repeated LevelingRouteQuest quests = 2;
	repeated LevelingRouteDungeon dungeons = 3;
}

// A quest we turn in on the route, at the level we're at then. We take the choice item that
// helps us most and every reward item.
message LevelingRouteQuest {
	int32 id = 1;
	string name = 2;
	int32 level = 3;
	repeated int32 choice_ids = 4;
	repeated int32 reward_ids = 5;
}

// A dungeon we run on the route, at the level we're at then.
message LevelingRouteDungeon {
	int32 zone_id = 1;
	string name = 2;
	int32 level = 3;
}

// An item we have from this level on, if it beats what the plan has in that slot.
message LevelingGearPin {
	int32 level = 1;
	ItemSlot slot = 2;
	ItemSpec item = 3;
}

// What the UI sends the Go leveling plan search (tools/levelingplan, docs/leveling_plan.md,
// Talent search). The search builds each level's request from base the way the Leveling Plan
// tab does: the gear plan's gear there, the talents, the rotation and the imbue.
message LevelingPlanSearchRequest {
	// The request of the settings, as the UI makes it for a sim.
	RaidSimRequest base = 1;
	LevelingPlanSettings plan = 2;
	LevelingGearPlanSettings gear_plan = 3;
	// The stat weights presets the gear plan judges items by, at their levels. With none it
	// takes gear_default_weights.
	repeated LevelingGearWeights gear_weights = 4;
	UnitStats gear_default_weights = 5;
	LevelingGearClassRules class_rules = 6;
	Faction faction = 7;
	LevelingTalentShape talent_shape = 8;
	// The levels we look for a respec at.
	repeated int32 respec_levels = 9;
	// The sessions of each sim during the search, and the most sessions of the sims for the
	// numbers we show (they stop once the noise is at most 0.1h).
	int32 sessions = 10;
	int32 confirm_sessions = 11;
	// The UI's gear plan at each of the plan's levels, from from_level. The search makes the
	// same gear plan itself (tools/levelingplan/gear.go), and stops with an error when the two
	// don't agree, so the gear we sim is the gear the UI shows.
	repeated EquipmentSpec ui_gear = 12;
	// Whether we also search the rotation of each level range, in turns with the talent route
	// until neither changes (tools/levelingplan/rotation.go, docs/leveling_plan.md).
	bool rotation_search = 13;
	// The spec's leveling route, when the gear plan takes it (LevelingGearPlanSettings.ignore_route).
	LevelingRoute route = 14;
}

message LevelingGearWeights {
	int32 level = 1;
	UnitStats weights = 2;
}

// What the class can wear and wield (proto_utils/utils.ts).
message LevelingGearClassRules {
	// The best armor type we can wear at each level, from level 1.
	repeated ArmorType max_armor_type = 1;
	repeated WeaponType weapon_types = 2;
	// Those of weapon_types we can also wield two-handed.
	repeated WeaponType two_hand_weapon_types = 3;
	repeated RangedWeaponType ranged_weapon_types = 4;
	bool can_dual_wield = 5;
}

// The class's talent trees as the leveling plan needs them (leveling_plan.ts, TalentShape).
message LevelingTalentShape {
	int32 points_per_row = 1;
	repeated LevelingTalentTree trees = 2;
}

message LevelingTalentTree {
	string name = 1;
	repeated LevelingTalentConfig talents = 2;
}

message LevelingTalentConfig {
	string name = 1;
	int32 row = 2;
	int32 col = 3;
	int32 max_points = 4;
	// The talent of the same tree it needs full first, or -1.
	int32 prereq = 5;
	// The sim gives nothing for it, like Improved Ghost Wolf.
	bool not_simulated = 6;
}

// One line of the search's answer: how far it is, or what it found.
message LevelingPlanSearchUpdate {
	oneof update {
		LevelingPlanSearchProgress progress = 1;
		LevelingPlanSearchResult result = 2;
	}
}

message LevelingPlanSearchProgress {
	string stage = 1;
	int32 sims = 2;
	// The best route's hours so far, 0 before we have one.
	double best_hours = 3;
}

message LevelingPlanSearchResult {
	int32 from_level = 1;
	int32 to_level = 2;
	int32 sessions = 3;
	// The sessions a level the confirm sims took to get the noise down.
	int32 confirm_sessions = 4;
	// The sims of a level the search ran, before the confirm sims.
	int32 sims = 5;
	// The best route without a respec, and the plan's own talents, over all the levels on the
	// confirm sessions, with the 95% noise of the hours the route saves.
	repeated LevelingTalentPick route = 6;
	double route_hours = 7;
	double plan_hours = 8;
	double noise = 9;
	repeated LevelingRespecResult respecs = 10;
	// Why the search couldn't run, like required talents no route can have. The rest is empty
	// then.
	string error = 11;
	// The seconds the search took.
	double seconds = 12;
	// With rotation_search: the rotations the search found, which route_hours and the respecs
	// are with, as the plan's library and level ranges have them. The plan's own talents with
	// them take rotation_only_hours, with the noise of what that saves against plan_hours.
	repeated LevelingRotationPreset rotation_library = 13;
	repeated LevelingRotation rotations = 14;
	repeated LevelingRotationBand bands = 15;
	double rotation_only_hours = 16;
	double rotation_only_noise = 17;
	// How many times we searched the rotations and then the route.
	int32 passes = 18;
}

// A level range of the rotation search: why it starts at its level, and what it changed.
message LevelingRotationBand {
	int32 level = 1;
	// The abilities that start it (like Chain Lightning), or none at a level where only a rank
	// is new, where we tune only the rest and mana thresholds.
	repeated string new_abilities = 2;
	// The knobs that differ from the range before, as name=value.
	string changes = 3;
	WeaponImbue imbue = 4;
	// The sims of a level this range's search ran.
	int32 sims = 5;
}

// The best build to respec into at a level, against keeping the route, both over the levels
// from the respec on.
message LevelingRespecResult {
	int32 level = 1;
	repeated LevelingTalentPick route = 2;
	double respec_hours = 3;
	double kept_hours = 4;
	double noise = 5;
}

// Local storage data for gear settings.
message SavedGearSet {
	EquipmentSpec gear = 1;
	UnitStats bonus_stats_stats = 3;
}

// Local storage data for other settings.
message SavedSettings {
	RaidBuffs raid_buffs = 1;
	PartyBuffs party_buffs = 2;
	Debuffs debuffs = 3;
	IndividualBuffs player_buffs = 4;
	Consumes consumes = 5;
	Race race = 6;
	repeated Profession professions = 10;
	bool enable_item_swap = 18;
	ItemSwap item_swap = 17;

	int32 reaction_time_ms = 11;
	int32 level = 19;
	int32 bonus_talent_points = 20;
	int32 main_hand_skill_gap = 21;
	int32 off_hand_skill_gap = 22;
	int32 channel_clip_delay_ms = 12;
	bool in_front_of_target = 13;
	double distance_from_target = 14;
	HealingModel healing_model = 15;

}

message SavedTalents {
	string talents_string = 1;
}

message SavedRotation {
	APLRotation rotation = 1;
}

message BlessingsAssignment {
	// Index corresponds to Spec that the blessing should be applied to.
	repeated Blessings blessings = 1;
}

message BlessingsAssignments {
	// Assignments for each paladin.
	repeated BlessingsAssignment paladins = 1;
}

// Local storage data for a saved encounter.
message SavedEncounter {
	Encounter encounter = 1;
}

// Local storage data for raid sim settings.
message SavedRaid {
	Raid raid = 1;
	BlessingsAssignments blessings = 3;
	Faction faction = 4;
	int32 phase = 5;
}

// Contains all information that is imported/exported from a raid sim.
message RaidSimSettings {
	SimSettings settings = 5;
	Raid raid = 1;
	BlessingsAssignments blessings = 3;
	Encounter encounter = 4;
}

// All the data related to running the sim once.
message SimRun {
	RaidSimRequest request = 1;
	RaidSimResult result = 2;
}

// Contains a sim run and also other context data.
message SimRunData {
	SimRun run = 1;

	// The run stored as a reference, for comparison to the current run.
	SimRun reference_run = 2;
}

// Sent by the sim to the detailed results page.
message DetailedResultsUpdate {
	oneof data {
		// Show results from a run.
		SimRunData run_data = 1;

		// Update sim settings.
		SimSettings settings = 2;
	}
}
