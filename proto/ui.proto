	SourceUnknown = 0;
	SourceCrafting = 1;
	SourceQuest = 2;
	SourceDungeon = 3;
	SourceRaid = 4;
	// SourceWorldBoss = 5;
	SourceWorldBOE = 6;
	SourceReputation = 7;
}

